[pytest]
# Put the repository root on sys.path so `automation.*` and `medintel-nexus-backend`
# imports resolve regardless of how pytest is invoked. Without this, running
# `pytest automation/tests/...` only puts automation/tests on sys.path and every
# `from automation.config.config import Config` raises ModuleNotFoundError.
pythonpath = .

testpaths = automation/tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    functional: Selenium end-to-end scenarios driven against the deployed web build
    performance: Load, stress and latency scenarios driven against the backend API
    security: Vulnerability and hardening scenarios driven against the backend API
    appium: Native Android scenarios; require a running Appium server and a device
    unit: Provider, state, network and ocr programmatic unit scenarios

addopts =
    --strict-markers
    --tb=short
    -ra

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %H:%M:%S
