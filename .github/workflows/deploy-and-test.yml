name: Deploy, Parallel Test Suites & Quality Reporting

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.44.0'
  PYTHON_VERSION: '3.11'

jobs:
  # ---------------------------------------------------------------------------
  # 1. Build the Flutter web bundle and publish it as a Pages artifact.
  # ---------------------------------------------------------------------------
  build:
    name: Build web bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Bundle Supabase environment configuration
        # Values come from repository secrets. Nothing is inlined here — a missing secret
        # should surface as a broken build, not silently ship a fallback credential.
        run: |
          {
            echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}"
            echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}"
            echo "GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}"
          } > .env

      # configure-pages with enablement:true turns GitHub Pages on for the repository if it is
      # not already enabled. This is what previously caused the deploy verification to 404 in a
      # loop: the gh-pages branch held a perfectly valid build that Pages was never serving.
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build Flutter web
        run: flutter build web --release --base-href "${{ steps.pages.outputs.base_path }}/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  # ---------------------------------------------------------------------------
  # 2. Deploy to Pages and export the real published URL for the test suites.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      base_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      # The URL comes from the deployment output rather than being assembled from the owner and
      # repository names, so owner casing and repo spelling can never drift out of sync.
      - name: Verify the deployment is serving
        run: |
          BASE_URL="${{ steps.deployment.outputs.page_url }}"
          echo "Verifying live deployment at: $BASE_URL"

          for attempt in $(seq 1 6); do
            CODE=$(curl -sSL -o /dev/null -w "%{http_code}" "$BASE_URL" || echo "000")
            if [ "$CODE" = "200" ]; then
              echo "Deployment is online (HTTP 200)."
              JS_CODE=$(curl -sSL -o /dev/null -w "%{http_code}" "${BASE_URL}flutter_bootstrap.js" || echo "000")
              if [ "$JS_CODE" = "200" ]; then
                echo "Live assets verified successfully."
                exit 0
              fi
              echo "::warning::index.html served but flutter_bootstrap.js returned HTTP $JS_CODE."
              exit 0
            fi
            echo "Attempt $attempt: not ready yet (HTTP $CODE). Waiting 10s..."
            sleep 10
          done

          echo "::error::Deployment verification failed. Last HTTP code: $CODE"
          exit 1

  # ---------------------------------------------------------------------------
  # 3a. Unit suite — Flutter widget/unit tests plus the FastAPI backend tests.
  #     Independent of the deployment, so it starts immediately.
  # ---------------------------------------------------------------------------
  unit:
    name: "Suite: unit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Flutter dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Flutter unit and widget tests
        run: flutter test --reporter expanded

      - name: Backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r medintel-nexus-backend/requirements.txt

      - name: Backend tests
        working-directory: medintel-nexus-backend
        run: python -m pytest tests -v

  # ---------------------------------------------------------------------------
  # 3b. Selenium suite — 900 functional scenarios against the live deployment.
  #     Sharded six ways; a session-scoped browser is reused across a whole shard.
  # ---------------------------------------------------------------------------
  selenium:
    name: "Suite: selenium (shard ${{ matrix.shard }})"
    runs-on: ubuntu-latest
    needs: deploy
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      # Chrome is preinstalled on ubuntu-latest, and Selenium Manager resolves the matching
      # driver automatically. The previous `apt-get install google-chrome-stable` could not
      # work because Google's apt repository was never added.
      - name: Verify Chrome availability
        run: google-chrome --version

      - name: Install suite dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium pytest requests openpyxl

      - name: Run functional scenarios
        env:
          BASE_URL: ${{ needs.deploy.outputs.base_url }}
          SUITE: functional
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: 6
        run: python -m pytest automation/tests/test_selenium.py -v

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-selenium-${{ matrix.shard }}
          path: automation/reports/JSON/results_*.json
          if-no-files-found: warn
          retention-days: 1

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-selenium-${{ matrix.shard }}
          path: |
            automation/reports/Logs/
            automation/reports/Screenshots/
          if-no-files-found: ignore
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 3c. Load suite — 300 performance scenarios against the backend. No browser.
  # ---------------------------------------------------------------------------
  load:
    name: "Suite: load"
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r medintel-nexus-backend/requirements.txt
          pip install pytest requests openpyxl

      - name: Start FastAPI backend
        working-directory: medintel-nexus-backend
        run: |
          nohup uvicorn main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8000/health | grep -q "ok"; then
              echo "Backend is healthy."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Backend did not become healthy in time."
          cat uvicorn.log
          exit 1

      - name: Run performance scenarios
        env:
          BASE_URL: ${{ needs.deploy.outputs.base_url }}
          BACKEND_URL: http://127.0.0.1:8000
          SUITE: performance
        run: python -m pytest automation/tests/test_load.py -v

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-load
          path: automation/reports/JSON/results_*.json
          if-no-files-found: warn
          retention-days: 1

  # ---------------------------------------------------------------------------
  # 3d. Vulnerability suite — 300 security scenarios. No browser.
  # ---------------------------------------------------------------------------
  vulnerability:
    name: "Suite: vulnerability"
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r medintel-nexus-backend/requirements.txt
          pip install pytest requests openpyxl

      - name: Start FastAPI backend
        working-directory: medintel-nexus-backend
        run: |
          nohup uvicorn main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8000/health | grep -q "ok"; then
              echo "Backend is healthy."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Backend did not become healthy in time."
          cat uvicorn.log
          exit 1

      - name: Run security scenarios
        env:
          BASE_URL: ${{ needs.deploy.outputs.base_url }}
          BACKEND_URL: http://127.0.0.1:8000
          SUITE: security
        run: python -m pytest automation/tests/test_vulnerability.py -v

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-vulnerability
          path: automation/reports/JSON/results_*.json
          if-no-files-found: warn
          retention-days: 1

  # ---------------------------------------------------------------------------
  # 3e. Appium suite — built and validated here, executed locally against a device.
  #     No Android emulator runs on CI, so this job proves the APK builds and the
  #     native suite imports and collects cleanly.
  # ---------------------------------------------------------------------------
  appium:
    name: "Suite: appium"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          flutter pub get
          python -m pip install --upgrade pip
          pip install pytest requests openpyxl Appium-Python-Client

      - name: Bundle Supabase environment configuration
        run: |
          {
            echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}"
            echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}"
            echo "GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}"
          } > .env

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Validate the native suite collects
        env:
          SUITE: appium
        run: python -m pytest automation/tests/test_appium.py --collect-only -v

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medintel-nexus-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 4. Aggregate every suite's results into the consolidated quality report.
  # ---------------------------------------------------------------------------
  report:
    name: Aggregate and report
    runs-on: ubuntu-latest
    needs: [unit, selenium, load, vulnerability, appium]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install reporting dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl requests

      - name: Prepare report directories
        run: mkdir -p automation/reports/{JSON,Logs,Screenshots,Excel,HTML,Summary}

      - name: Download suite results
        uses: actions/download-artifact@v4
        with:
          path: temp_artifacts/
          pattern: results-*
          merge-multiple: false

      - name: Collect result files
        run: |
          find temp_artifacts/ -name "results_*.json" -exec cp {} automation/reports/JSON/ \;
          echo "Collected result files:"
          ls -la automation/reports/JSON/

      # Fails loudly if no suite produced results, rather than fabricating a dataset.
      - name: Compile consolidated reports
        run: python -m automation.utils.report_generator

      - name: Evaluate SLA gate
        run: python -m automation.utils.summary_generator

      - name: Publish job summary
        if: always()
        run: |
          if [ -f automation/reports/Summary/summary.md ]; then
            cat automation/reports/Summary/summary.md >> $GITHUB_STEP_SUMMARY
          else
            echo "No summary was generated — the suites did not produce results." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload consolidated reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MedIntel_QA_Consolidated_Reports
          path: |
            automation/reports/Excel/
            automation/reports/HTML/
            automation/reports/JSON/execution-results.json
            automation/reports/Summary/
          if-no-files-found: warn
          retention-days: 30
