name: Deploy and E2E Test Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FLUTTER_VERSION: '3.44.0'
  PYTHON_VERSION: '3.11'

jobs:
  deploy-and-test:
    name: "Build, Deploy and E2E Test"
    runs-on: ubuntu-latest
    concurrency:
      group: 'pages'
      cancel-in-progress: true
    steps:
      # ==========================================
      # Stage 1: Repository Checkout
      # ==========================================
      - name: Stage 1 - Repository Checkout
        uses: actions/checkout@v4

      # ==========================================
      # Stage 2: Dependency Installation
      # ==========================================
      - name: Stage 2 - Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Stage 2 - Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Stage 2 - Install Flutter Dependencies
        run: flutter pub get

      - name: Stage 2 - Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Stage 2 - Verify Chrome Availability
        run: google-chrome --version

      - name: Stage 2 - Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium pytest requests openpyxl

      - name: Stage 2 - Install Backend Dependencies
        run: |
          pip install -r medintel-nexus-backend/requirements.txt || true

      # ==========================================
      # Stage 3: Build Application
      # ==========================================
      - name: Stage 3 - Build Application
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      # ==========================================
      # Stage 4: Static Analysis
      # ==========================================
      - name: Stage 4 - Static Analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # ==========================================
      # Stage 5: Deploy to GitHub Pages
      # ==========================================
      - name: Stage 5 - Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Stage 5 - Upload Pages Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Stage 5 - Deploy to GitHub Pages
        id: deployment
        if: github.event_name != 'pull_request'
        uses: actions/deploy-pages@v4

      # ==========================================
      # Stage 6 & 7: Wait for Deployment & Verification
      # ==========================================
      - name: Set Base URL Environment Variable
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] || [ -none = "${{ steps.deployment.outputs.page_url }}" ]; then
            # Casing fallback or manual variable config
            echo "BASE_URL=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> $GITHUB_ENV
          else
            echo "BASE_URL=${{ steps.deployment.outputs.page_url }}" >> $GITHUB_ENV
          fi

      - name: Stage 6 & 7 - Deployment Verification
        run: python automation/utils/verify_deployment.py

      # ==========================================
      # Stage 8: Run E2E Tests (Selenium, Appium, Load, Security)
      # ==========================================
      - name: Start FastAPI backend for Load and Security tests
        working-directory: medintel-nexus-backend
        run: |
          nohup uvicorn main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8000/health | grep -q "ok"; then
              echo "Backend is healthy."
              exit 0
            fi
            sleep 2
          done
          echo "::warning::Backend did not start in time. Falling back to mocks."

      - name: Stage 8 - Run Selenium E2E Tests
        env:
          SUITE: functional
        run: python -m pytest automation/tests/test_selenium.py -v

      - name: Stage 8 - Run Appium Tests (Mock)
        env:
          SUITE: appium
        run: python -m pytest automation/tests/test_appium.py -v

      - name: Stage 8 - Run Load Tests (Performance)
        env:
          SUITE: performance
        run: python -m pytest automation/tests/test_load.py -v

      - name: Stage 8 - Run Vulnerability Tests (Security)
        env:
          SUITE: security
        run: python -m pytest automation/tests/test_vulnerability.py -v

      # ==========================================
      # Stage 9 & 10: Generate Reports
      # ==========================================
      - name: Stage 9 & 10 - Generate HTML and Excel Reports
        run: |
          python -m automation.utils.report_generator
          python -m automation.utils.summary_generator

      # ==========================================
      # Stage 11: Upload Artifacts
      # ==========================================
      - name: Stage 11 - Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Test_Results_Artifacts
          path: |
            Test Results/
          if-no-files-found: warn
          retention-days: 30

      # ==========================================
      # Stage 12: Publish Summary
      # ==========================================
      - name: Stage 12 - Publish Summary
        if: always()
        run: |
          if [ -f "Test Results/Summary/summary.md" ]; then
            cat "Test Results/Summary/summary.md" >> $GITHUB_STEP_SUMMARY
          else
            echo "No execution summary was found." >> $GITHUB_STEP_SUMMARY
          fi

      # ==========================================
      # Stage 13: Store Historical Results
      # ==========================================
      - name: Stage 13 - Store Historical Results
        if: always()
        run: |
          echo "Test execution completed. Historical reports and logs preserved in uploaded GHA artifacts."
