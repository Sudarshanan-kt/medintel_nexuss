name: Enterprise CI/CD Deployment, Live E2E Automation & Quality Reporting

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Grant permissions required for GitHub Pages deployment and workflow artifact management
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Bundle Supabase Environment Configuration
        run: |
          # Write environment configuration to root .env file so it is bundled as a Flutter asset
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL || 'https://rhrvqnonrjfjexfqewjf.supabase.co' }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_Iv-guLi4F2MM8mSGix1MYQ_hfQj7CYu' }}" >> .env
          echo "GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID || '691219519209-0bmvsi37cctm86idhvrue2a28aqbjjaq.apps.googleusercontent.com' }}" >> .env
          cat .env

      - name: Build Flutter Web Application
        run: |
          # Build Flutter web app with release optimization and the appropriate base href for GitHub Pages hosting
          flutter build web --release --base-href=/${{ github.event.repository.name }}/

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build/web
          branch: gh-pages
          clean: true

      - name: Wait for Deployment & Verify Availability
        run: |
          # Verify deployment availability (HTTP 200 on page and assets, with retry logic)
          DEPLOY_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          echo "Verifying live deployment at $DEPLOY_URL"
          
          # Retry loop to wait for GitHub Pages deployment update (max 5 minutes)
          SUCCESS=false
          for i in {1..15}; do
            echo "Attempt $i: Checking deployment health..."
            RESPONSE_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$DEPLOY_URL" || true)
            if [ "$RESPONSE_CODE" = "200" ]; then
              echo "Deployment is online! (Received HTTP 200)"
              SUCCESS=true
              break
            fi
            echo "Deployment not ready (HTTP $RESPONSE_CODE). Waiting 20 seconds..."
            sleep 20
          done
          
          if [ "$SUCCESS" = "false" ]; then
            echo "::error::Deployment Verification Failed: Live application URL was not available."
            exit 1
          fi
          
          # Asset verification checks (CSS/JS files inside page loader)
          echo "Checking main scripts..."
          JS_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${DEPLOY_URL}flutter_bootstrap.js")
          if [ "$JS_CODE" != "200" ]; then
            echo "::error::Asset Verification Failed: flutter_bootstrap.js is missing or inaccessible (HTTP $JS_CODE)."
            exit 1
          fi
          echo "Live assets verified successfully."

  execute-tests:
    runs-on: ubuntu-latest
    needs: build-and-deploy
    strategy:
      matrix:
        job_index: [0, 1, 2, 3, 4]
      fail-fast: false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System dependencies (Chrome & Chrome Driver)
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install Python Backend Dependencies
        run: |
          cd medintel-nexus-backend
          pip install -r requirements.txt
          pip install uvicorn

      - name: Start FastAPI Backend in Background
        run: |
          cd medintel-nexus-backend
          # Start backend server on port 8000 using uvicorn
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          
          # Wait and poll health endpoint
          echo "Waiting for FastAPI server to start..."
          for i in {1..10}; do
            if curl -s http://localhost:8000/health | grep -q "ok"; then
              echo "FastAPI Backend is online and healthy."
              break
            fi
            sleep 2
          done

      - name: Install Automation Suite Requirements
        run: |
          pip install selenium pytest openpyxl requests

      - name: Execute Parallel Selenium & Scenario Partition
        env:
          BASE_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          BACKEND_URL: "http://localhost:8000"
          JOB_INDEX: ${{ matrix.job_index }}
          TOTAL_JOBS: 5
          TESTS_PER_JOB: 300
        run: |
          # Run pytest on our Selenium suite partition
          pytest automation/tests/test_selenium.py -v --tb=short || true

      - name: Upload Intermediate Partition JSON Report
        uses: actions/upload-artifact@v4
        with:
          name: intermediate_results_job_${{ matrix.job_index }}
          path: automation/reports/JSON/results_job_${{ matrix.job_index }}.json
          retention-days: 1

      - name: Upload Matrix Job Diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics_job_${{ matrix.job_index }}
          path: |
            automation/reports/Logs/
            automation/reports/Screenshots/
          retention-days: 30

  aggregate-and-report:
    runs-on: ubuntu-latest
    needs: execute-tests
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Report Utility Dependencies
        run: |
          pip install openpyxl requests

      - name: Create Reports Directories
        run: |
          mkdir -p automation/reports/JSON
          mkdir -p automation/reports/Logs
          mkdir -p automation/reports/Screenshots
          mkdir -p automation/reports/Excel
          mkdir -p automation/reports/HTML
          mkdir -p automation/reports/Summary

      - name: Download all Intermediate Partition Results
        uses: actions/download-artifact@v4
        with:
          path: temp_artifacts/

      - name: Move downloaded JSONs to reporting directory
        run: |
          find temp_artifacts/ -name "results_job_*.json" -exec cp {} automation/reports/JSON/ \;
          ls -R automation/reports/JSON/

      - name: Compile and Aggregate Final Reports
        env:
          BASE_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
        run: |
          # Consolidate reports and generate Excel & HTML sheets
          python automation/utils/report_generator.py

      - name: Evaluate Gateway SLA Pass/Fail Status
        run: |
          # Run SLA check (fails workflow if pass rate < 95% or critical defect rate > 5%)
          python automation/utils/summary_generator.py

      - name: Publish Markdown Job Summary
        if: always()
        run: |
          # Output final execution details to GHA summary tab
          cat automation/reports/Summary/summary.md >> $GITHUB_STEP_SUMMARY

      - name: Upload Final Consolidated Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MedIntel_QA_Consolidated_Reports
          path: |
            automation/reports/Excel/
            automation/reports/HTML/
            automation/reports/JSON/execution-results.json
            automation/reports/Summary/
          retention-days: 30
